name: Release

on:
  push:
    tags:
      - "v*.*.*"      # ex. v0.1.0, v1.2.3-rc1
  workflow_dispatch:  # déclenchement manuel possible

permissions:
  contents: read
  packages: write   # publication sur ghcr.io
  id-token: write   # provenance / OIDC

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # → ghcr.io/<owner>/<repo>

jobs:

  # ──────────────────────────────────────────────────────────────────────
  # On rejoue la CI sur le tag avant de publier (filet de sécurité).
  # ──────────────────────────────────────────────────────────────────────
  ci-on-tag:
    name: Re-run CI on tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ──────────────────────────────────────────────────────────────────────
  # Build + push image runtime (target=runtime — pas l'image test fat).
  # ──────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build + push image runtime → GHCR
    needs: [ci-on-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build + push (target=runtime, linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Si vous voulez aussi publier l'image `vector` (runtime + RAG stack) :
      # décommentez ce step. Image plus lourde, à ne pousser que si besoin.
      #
      # - name: Build + push (target=vector)
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: .
      #     file: ./Dockerfile
      #     target: vector
      #     platforms: linux/amd64
      #     push: true
      #     tags: |
      #       ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-vector:${{ github.ref_name }}
      #       ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-vector:latest
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max
